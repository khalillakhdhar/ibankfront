  <nav>
    <p>ESPACE DE TRAVAIL</p>
    <a [routerLink]="base()" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Vue d’ensemble</a>
    <a [routerLink]="base() + '/clients'" routerLinkActive="active">Clients</a>
    <a [routerLink]="base() + '/comptes'" routerLinkActive="active">Comptes</a>

      <a [routerLink]="base() + '/agents/new'" routerLinkActive="active">Nouvel agent</a>
    }
    <p>COMPTE</p><a [routerLink]="base() + '/profil'" routerLinkActive="active">Mon profil</a>
  </nav>
</aside>

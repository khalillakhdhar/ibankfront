<aside
  id="main-navigation"
  class="sidebar"
  [class.open]="open()"
  aria-label="Navigation principale"
>
  <a class="brand" routerLink="/dashboard" (click)="closeMenu.emit()"
    ><span>iB</span><strong>iBank</strong></a
  >
  <nav>
    <p>ESPACE DE TRAVAIL</p>
    <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu.emit()"
      >Vue d’ensemble</a
    >
    <a routerLink="/clients" routerLinkActive="active" (click)="closeMenu.emit()">Clients</a>
    <a routerLink="/comptes" routerLinkActive="active" (click)="closeMenu.emit()">Comptes</a>
    <a routerLink="/transactions" routerLinkActive="active" (click)="closeMenu.emit()"
      >Transactions</a
    >
    @if (isAdmin()) {
      <p>ADMINISTRATION</p>
      <a routerLink="/admin/guichets" routerLinkActive="active" (click)="closeMenu.emit()"
        >Guichets</a
      >
      <a routerLink="/admin/types-comptes" routerLinkActive="active" (click)="closeMenu.emit()"
        >Types de comptes</a
      >
      <a routerLink="/admin/agents/new" routerLinkActive="active" (click)="closeMenu.emit()"
        >Agents</a
      >
    }
  </nav>
</aside>

<div class="backdrop" role="presentation" (click)="cancel.emit()">
  <section
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    (click)="$event.stopPropagation()"
  >
    <h2 id="confirm-title">{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div>
      <button class="button" type="button" [disabled]="busy()" (click)="cancel.emit()">Annuler</button
      ><button class="button primary" type="button" [disabled]="busy()" (click)="confirm.emit()">{{ busy() ? 'Traitement…' : 'Confirmer' }}</button>
    </div>
  </section>
</div>

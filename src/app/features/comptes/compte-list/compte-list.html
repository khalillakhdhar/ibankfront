<header>
  <div>
    <p class="eyebrow">PRODUITS BANCAIRES</p>
    <h1>Comptes</h1>
    <p>Vue consolidée des comptes clients.</p>
  </div>
  <a class="button primary" routerLink="new">Ouvrir un compte</a>
</header>
<section class="filters">
  <input type="search" aria-label="Rechercher un compte" placeholder="Numéro ou client" /><select
    aria-label="Type de compte"
  >
    <option>Tous les types</option>
    <option>Courant</option>
    <option>Épargne</option></select
  ><button type="button">Filtrer</button>
</section>
<div class="table">
  <table>
    <thead>
      <tr>
        <th>Numéro</th>
        <th>Client</th>
        <th>Type</th>
        <th>Guichet</th>
        <th>Solde</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="empty-state">Aucun compte à afficher.</p>
</div>

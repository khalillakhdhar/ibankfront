<h1>Ouvrir un compte</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>Numéro de compte<input formControlName="numeroCompte"></label><label>Solde initial<input type="number" min="0" formControlName="soldeInitial"></label><label>Client<select formControlName="clientId"><option [ngValue]="0">Sélectionner</option>@for(c of clients.clients();track c.id){<option [ngValue]="c.id">{{c.prenom}} {{c.nom}}</option>}</select></label><label>Type<select formControlName="typeCompteId"><option [ngValue]="0">Sélectionner</option>@for(t of types.typesCompte();track t.id){<option [ngValue]="t.id">{{t.libelle}}</option>}</select></label><label>Guichet<select formControlName="guichetId"><option [ngValue]="0">Sélectionner</option>@for(g of guichets.guichets();track g.id){<option [ngValue]="g.id">{{g.nom}}</option>}</select></label><div><a class="button" routerLink="/comptes">Annuler</a><button class="button primary" [disabled]="submitting()">Ouvrir</button></div></form>

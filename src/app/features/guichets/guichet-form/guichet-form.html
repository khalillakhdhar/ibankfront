<header><p class="eyebrow">RÉSEAU</p><h1>{{edit?'Modifier':'Créer'}} un guichet</h1></header><form #f="ngForm" (ngSubmit)="submit(f)"><label>Code<input name="code" [(ngModel)]="model.code" required minlength="2" maxlength="20" [disabled]="edit"/></label><label>Nom<input name="nom" [(ngModel)]="model.nom" required maxlength="120"/></label><label>Adresse<input name="adresse" [(ngModel)]="model.adresse" required maxlength="200"/></label><label>Ville<input name="ville" [(ngModel)]="model.ville" required maxlength="100"/></label><label>Téléphone<input name="telephone" [(ngModel)]="model.telephone" maxlength="30"/></label>@if(edit){<label><input type="checkbox" name="active" [(ngModel)]="model.isActive"/> Actif</label>}@if(error){<p class="alert">{{error}}</p>}<div class="actions"><a class="button" routerLink="../">Annuler</a><button class="button primary" [disabled]="f.invalid||busy()">Enregistrer</button></div></form>

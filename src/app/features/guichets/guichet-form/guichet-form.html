<h1>{{id?'Modifier le guichet':'Nouveau guichet'}}</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>Code<input formControlName="code" [readOnly]="!!id"></label><label>Nom<input formControlName="nom"></label><label>Adresse<input formControlName="adresse"></label><label>Ville<input formControlName="ville"></label><label>Téléphone<input formControlName="telephone"></label>@if(id){<label><input type="checkbox" formControlName="isActive"> Actif</label>}<button class="button primary" [disabled]="pending()">Enregistrer</button></form>

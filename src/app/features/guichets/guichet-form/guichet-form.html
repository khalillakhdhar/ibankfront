<header>
  <p class="eyebrow">RÉSEAU</p>
  <h1>Créer ou modifier un guichet</h1>
</header>
<form>
  <label for="branch-code">Code<input id="branch-code" required /></label
  ><label for="branch-name">Nom<input id="branch-name" required /></label
  ><label for="branch-address">Adresse<input id="branch-address" required /></label
  ><label for="branch-city">Ville<input id="branch-city" required /></label
  ><label for="branch-phone">Téléphone<input id="branch-phone" /></label
  ><label><input type="checkbox" /> Guichet actif</label>
  <div class="actions">
    <a class="button" routerLink="../">Annuler</a
    ><button class="button primary" type="button">Enregistrer</button>
  </div>
</form>

<h1>{{id?'Modifier le type':'Nouveau type de compte'}}</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>Code<input formControlName="code" [readOnly]="!!id"></label><label>Libellé<input formControlName="libelle"></label><label>Description<textarea formControlName="description"></textarea></label><label>Solde minimum<input type="number" formControlName="soldeMinimum"></label><label>Frais mensuels<input type="number" formControlName="fraisMensuels"></label>@if(id){<label><input type="checkbox" formControlName="isActive"> Actif</label>}<button class="button primary" [disabled]="pending()">Enregistrer</button></form>

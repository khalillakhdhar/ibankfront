<header>
  <p class="eyebrow">CATALOGUE</p>
  <h1>Créer ou modifier un type</h1>
</header>
<form>
  <label for="type-code">Code<input id="type-code" required /></label
  ><label for="type-label">Libellé<input id="type-label" required /></label
  ><label for="type-description">Description<textarea id="type-description"></textarea></label
  ><label for="minimum">Solde minimum<input id="minimum" type="number" min="0" /></label
  ><label for="fees">Frais mensuels<input id="fees" type="number" min="0" /></label
  ><label><input type="checkbox" /> Type actif</label>
  <div class="actions">
    <a class="button" routerLink="../">Annuler</a
    ><button class="button primary" type="button">Enregistrer</button>
  </div>
</form>

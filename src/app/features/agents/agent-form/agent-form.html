<p class="eyebrow">ADMINISTRATION</p>
<h1>Créer un agent</h1>
<p>Le backend ne fournit pas de liste d’agents : cet écran est limité à la création.</p>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Nom<input formControlName="nom" /></label
  ><label>Prénom<input formControlName="prenom" /></label
  ><label>E-mail<input type="email" formControlName="email" /></label
  ><label>Mot de passe<input type="password" formControlName="password" /></label
  ><label
    >Guichet<select formControlName="guichetId">
      <option [ngValue]="0">Aucun</option>
      @for (g of guichets.guichets(); track g.id) {
        <option [ngValue]="g.id">{{ g.nom }}</option>
      }
    </select></label
  >
  @if (auth.error()) {
    <p class="error">{{ auth.error() }}</p>
  }
  @if (success()) {
    <p class="success">Agent créé avec succès.</p>
  }
  <button class="button primary" [disabled]="pending()">Créer l’agent</button>
</form>

<header><p class="eyebrow">DOSSIER CLIENT</p><h1>Créer ou modifier un client</h1><p>Renseignez les informations d’identité et de contact.</p></header>
<form><div class="form-grid"><label for="cin">CIN<input id="cin" name="cin" required /></label><label for="nom">Nom<input id="nom" name="nom" required /></label><label for="prenom">Prénom<input id="prenom" name="prenom" required /></label><label for="birth">Date de naissance<input id="birth" name="dateNaissance" type="date" /></label><label for="email">E-mail<input id="email" name="email" type="email" /></label><label for="phone">Téléphone<input id="phone" name="telephone" required /></label><label class="wide" for="address">Adresse<textarea id="address" name="adresse"></textarea></label><label><input name="isActive" type="checkbox" /> Client actif</label></div><div class="actions"><a class="button" routerLink="../">Annuler</a><button class="button primary" type="button">Enregistrer le dossier</button></div></form>

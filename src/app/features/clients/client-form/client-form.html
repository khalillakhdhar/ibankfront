<header><p class="eyebrow">CLIENT</p><h1>{{id?'Modifier le client':'Nouveau client'}}</h1></header><form [formGroup]="form" (ngSubmit)="submit()"><label>CIN<input formControlName="cin" [readOnly]="!!id"></label><label>Nom<input formControlName="nom"></label><label>Prénom<input formControlName="prenom"></label><label>Date de naissance<input type="date" formControlName="dateNaissance"></label><label>E-mail<input type="email" formControlName="email"></label><label>Téléphone<input formControlName="telephone"></label><label class="wide">Adresse<textarea formControlName="adresse"></textarea></label>@if(id){<label class="check"><input type="checkbox" formControlName="isActive"> Client actif</label>}@if(service.error()){<p class="alert">{{service.error()}}</p>}<div class="wide actions"><a class="button" routerLink="/clients">Annuler</a><button class="button primary" [disabled]="submitting()">{{submitting()?'Enregistrement…':'Enregistrer'}}</button></div></form>
